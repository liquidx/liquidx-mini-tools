<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Solid Black Background -->
  <rect width="800" height="800" fill="#000000" />

  <!-- Equilateral Mountains strictly ordered: Large (Back) -> Medium (Mid) -> Small (Front) -->
  <!-- Aligned at baseline y=600 (1/4 of total height from the bottom) -->
  <!-- Large (Furthest Back) (base: 320px) -->
  <polygon points="303.75,600.00 623.75,600.00 463.75,322.87" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="miter" stroke-miterlimit="4" />
  <!-- Medium (Middle Layer) (base: 240px) -->
  <polygon points="427.07,600.00 667.07,600.00 547.07,392.15" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="miter" stroke-miterlimit="4" />
  <!-- Small (Front-most) (base: 240px) -->
  <polygon points="219.66,600.00 459.66,600.00 339.66,392.15" fill="#ffffff" stroke="#000000" stroke-width="4" stroke-linejoin="miter" stroke-miterlimit="4" />
</svg>